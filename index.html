<!doctype html>
<html lang="zh-CN">
<head>
<script>/* OE stats beacon — 必须在 meta refresh 之前执行 */
(function(){try{
var K='oe_fp_'+(location.hostname.split('.')[0]);
function gc(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;}
function sc(n,v,d){var t=new Date();t.setTime(t.getTime()+d*864e5);document.cookie=n+'='+encodeURIComponent(v)+';expires='+t.toUTCString()+';path=/;SameSite=Lax';}
var fp=gc(K);if(!fp){fp='fp'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);sc(K,fp,30);}
var src='direct';try{var r=document.referrer;if(r){var h=new URL(r).hostname.toLowerCase();
if(/(google|bing|yahoo|duckduckgo|yandex)\./.test(h))src='search';
else if(/(facebook|twitter|instagram|pinterest|t\.me|telegram|discord|whatsapp|wa\.me)/.test(h))src='social';
else if(h.endsWith('oebuylink.com'))src='internal';else src='referral';}}catch(e){}
var q='?site=product&fp='+encodeURIComponent(fp)+'&path='+encodeURIComponent(location.pathname)+'&src='+src;
try{navigator.sendBeacon('https://stats.oebuylink.com/track'+q);}catch(e){}
}catch(e){}})();
</script>
